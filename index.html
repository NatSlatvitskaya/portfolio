<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natasha — Graphic & Brand Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Зеленая неоновая цветовая гамма из вашего нового макета */
      --green-bg: #20E298; 
      --folder-color: #121214; /* Приглушенные контрастные темные папки */
      --text-white: #FFFFFF;
      --text-dark: #121214;
      --font-heading: 'Unbounded', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      
      --card-bg: rgba(18, 18, 20, 0.95);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-light: #F3F4F6;
      --text-muted: #9CA3AF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--green-bg);
      font-family: var(--font-body);
      color: var(--text-dark);
      min-height: 100vh;
      overflow: hidden; /* Всё на одном экране */
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px;
    }

    /* Фоновые радиальные свечения для красивого объема */
    .glow-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 75% 50%, rgba(255, 255, 255, 0.35) 0%, transparent 60%),
                  radial-gradient(circle at 25% 50%, rgba(255, 255, 255, 0.2) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }

    /* ==========================================================================
       ВЕРХНЯЯ ШАПКА
       ========================================================================== */
    .header-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
    }

    .nav-link {
      font-family: var(--font-body);
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      color: var(--text-dark);
      transition: opacity 0.2s;
    }
    .nav-link:hover { opacity: 0.8; }

    .bio-center {
      text-align: center;
      max-width: 450px;
    }

    .bio-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .bio-subtitle {
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0.9;
    }

    .experience-tag {
      font-size: 1.1rem;
      font-weight: 700;
    }

    /* ==========================================================================
       МАСКОТ (Котик-кролик со следящими под-глазами)
       ========================================================================== */
    .mascot-container {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(650px, 95vw);
      height: 75vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 2;
      pointer-events: none;
    }

    .mascot-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* ВАЖНО: Картинка котика с дырками накладывается НАД глазами */
    .mascot-image {
      position: absolute;
      inset: 0;
      background-image: url('cat_body.png'); 
      background-size: contain;
      background-position: center bottom;
      background-repeat: no-repeat;
      z-index: 3; /* Слой выше зрачков */
    }

    /* Слой для глаз, находящийся ПОД телом котика */
    .eyes-underlay {
      position: absolute;
      inset: 0;
      z-index: 2; /* Слой ниже котика */
    }

    /* Область каждого глаза (настраивается под точные размеры и координаты дырок) */
    .eye-socket {
      position: absolute;
      width: 80px;  /* Ширина глазного яблока */
      height: 60px; /* Высота глазного яблока */
      overflow: hidden; /* Глаз скроется, если уйдет за границу */
    }

    /* Точная подгонка координат под дырки в файле cat_body.png */
    .socket-left {
      left: 36.8%;
      top: 40.5%;
    }

    .socket-right {
      right: 36.8%;
      top: 40.5%;
    }

    /* Картинка самого глаза, которая двигается внутри сокета */
    .eye-graphic {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: url('eye.png'); /* Картинка глаза целиком */
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      transition: transform 0.08s ease-out;
    }

    /* ==========================================================================
       КАРТОЧКИ КЕЙСОВ
       ========================================================================== */
    .projects-container {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .project-item {
      position: absolute;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .project-item:hover {
      transform: scale(1.1) translateY(-4px);
    }

    .folder-shape {
      width: 100px;
      height: 70px;
      background-color: var(--folder-color);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(18, 18, 20, 0.2);
    }

    .image-shape {
      width: 100px;
      height: 70px;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      box-shadow: 0 10px 25px rgba(18, 18, 20, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .project-label {
      font-family: var(--font-heading);
      font-size: 0.65rem;
      font-weight: 900;
      color: var(--text-dark);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* Точки позиционирования проектов вокруг кота */
    .item-1 { top: 15%; left: 18%; }  /* SMART (картинка) */
    .item-2 { top: 38%; left: 25%; }  /* MEMORIA (картинка) */
    .item-3 { top: 43%; left: 2%; }   /* LIDIA&POGGIO (картинка) */
    .item-4 { top: 60%; left: 16%; }  /* AGLY GIRL (папка) */
    
    .item-5 { top: 28%; right: 28%; } /* СЛЁТ (папка) */
    .item-6 { top: 15%; right: 10%; } /* ПЛАТФОРМА (папка) */
    .item-7 { top: 43%; right: 10%; } /* SMARTY (картинка) */
    .item-8 { top: 60%; right: 23%; } /* LANDING (папка) */
    .item-9 { top: 41%; right: 3%; }  /* SPRITE RIG (картинка) */

    /* ==========================================================================
       НИЖНИЙ СТЕКЛЯННЫЙ ДОК
       ========================================================================== */
    .dock-wrapper {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .cv-badge {
      pointer-events: auto;
      background-color: var(--folder-color);
      color: var(--green-bg);
      padding: 6px 20px;
      border-radius: 20px;
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }
    .cv-badge:hover { transform: scale(1.05); }

    .glass-dock {
      pointer-events: auto;
      background: rgba(18, 18, 20, 0.15);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(18, 18, 20, 0.2);
      border-radius: 40px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    .dock-divider {
      width: 1px;
      height: 30px;
      background-color: rgba(18, 18, 20, 0.2);
    }

    .avatar-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--text-dark);
      overflow: hidden;
      cursor: pointer;
    }

    .avatar-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--green-bg);
      text-decoration: none;
      font-size: 1.2rem;
      transition: transform 0.2s, background-color 0.2s;
    }

    .icon-circle:hover {
      transform: scale(1.1);
      background-color: #fff;
      color: var(--text-dark);
    }

    .icon-tg { background: var(--text-dark); }
    .icon-email { background: var(--text-dark); }

    /* ==========================================================================
       ПОПАП КЕЙСОВ
       ========================================================================== */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(15px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .popup-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .popup-content {
      background: #121214;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      width: min(750px, 95vw);
      max-height: 80vh;
      overflow-y: auto;
      padding: 32px;
      position: relative;
    }

    .popup-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }

    .popup-title {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      color: var(--green-bg);
      margin-bottom: 8px;
    }

    .popup-desc {
      color: #D6C2CE;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    /* Мобильная версия сайта */
    @media (max-width: 900px) {
      body { overflow-y: auto; }
      .projects-container {
        position: relative;
        margin-top: 150px;
        margin-bottom: 200px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        padding: 20px;
      }
      .project-item {
        position: relative;
        top: auto !important; left: auto !important; right: auto !important;
        transform: none !important;
      }
      .mascot-container {
        position: fixed;
        bottom: 0;
        opacity: 0.35;
        height: 60vh;
      }
    }
  </style>
</head>
<body>

  <div class="glow-overlay"></div>

  <!-- Шапка сайта -->
  <div class="header-bar">
    <a href="#" class="nav-link">Все проекты</a>
    <div class="bio-center">
      <div class="bio-title">Привет, Я — Наташа</div>
      <div class="bio-subtitle">{графический и бренд-дизайнер}</div>
    </div>
    <div class="experience-tag">5 лет опыта</div>
  </div>

  <!-- Проекты (Иконки и Картинки) -->
  <div class="projects-container">
    
    <!-- 1. SMART (Картинка) -->
    <div class="project-item item-1" onclick="openPopup('smart')">
      <div class="image-shape" style="background-image: url('https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=300&q=80');"></div>
      <div class="project-label">Smart</div>
    </div>

    <!-- 2. MEMORIA (Картинка) -->
    <div class="project-item item-2" onclick="openPopup('memoria')">
      <div class="image-shape" style="background-image: url('https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=300&q=80');"></div>
      <div class="project-label">Memoria</div>
    </div>

    <!-- 3. LIDIA&POGGIO (Картинка) -->
    <div class="project-item item-3" onclick="openPopup('lidia')">
      <div class="image-shape" style="background-image: url('https://images.unsplash.com/photo-1563089145-599997674d42?w=300&q=80');"></div>
      <div class="project-label">Lidia&Poggio</div>
    </div>

    <!-- 4. AGLY GIRL (Папка) -->
    <div class="project-item item-4" onclick="openPopup('agly')">
      <div class="folder-shape"></div>
      <div class="project-label">Agly Girl</div>
    </div>

    <!-- 5. СЛЁТ (Папка) -->
    <div class="project-item item-5" onclick="openPopup('slet')">
      <div class="folder-shape"></div>
      <div class="project-label">Слёт</div>
    </div>

    <!-- 6. ПЛАТФОРМА (Папка) -->
    <div class="project-item item-6" onclick="openPopup('platform')">
      <div class="folder-shape"></div>
      <div class="project-label">Платформа</div>
    </div>

    <!-- 7. SMARTY (Картинка) -->
    <div class="project-item item-7" onclick="openPopup('smarty')">
      <div class="image-shape" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&q=80');"></div>
      <div class="project-label">Smarty</div>
    </div>

    <!-- 8. LANDING (Папка) -->
    <div class="project-item item-8" onclick="openPopup('landing')">
      <div class="folder-shape"></div>
      <div class="project-label">Landing</div>
    </div>

    <!-- 9. SPRITE RIG (Картинка) -->
    <div class="project-item item-9" onclick="openPopup('sprite')">
      <div class="image-shape" style="background-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=300&q=80');"></div>
      <div class="project-label">Sprite Rig</div>
    </div>

  </div>

  <!-- Персонаж Котик-Кролик -->
  <div class="mascot-container">
    <div class="mascot-wrapper">
      
      <!-- Слой с интерактивными под-глазами (под телом) -->
      <div class="eyes-underlay">
        <!-- Левый глаз -->
        <div class="eye-socket socket-left">
          <div id="eye-l" class="eye-graphic"></div>
        </div>
        <!-- Правый глаз -->
        <div class="eye-socket socket-right">
          <div id="eye-r" class="eye-graphic"></div>
        </div>
      </div>
      
      <!-- Тело котика с вырезанными зрачками (накладывается поверх глаз) -->
      <div class="mascot-image"></div>
      
    </div>
  </div>

  <!-- Нижний док -->
  <div class="dock-wrapper">
    <a href="#" class="cv-badge" onclick="openPopup('cv')">CV</a>
    <div class="glass-dock">
      
      <div class="avatar-btn" onclick="openPopup('cv')">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80" alt="Avatar">
      </div>
      
      <div class="dock-divider"></div>
      <a href="#" class="icon-circle">⚫</a>
      <a href="#" class="icon-circle">⚪</a>
      <div class="dock-divider"></div>
      
      <a href="https://t.me/your_telegram" target="_blank" class="icon-circle icon-tg">✈️</a>
      <a href="mailto:your_email@gmail.com" class="icon-circle icon-email">✉️</a>
      
    </div>
  </div>

  <!-- Попап -->
  <div class="popup-overlay" id="popup-overlay" onclick="closePopupOnBg(event)">
    <div class="popup-content">
      <button class="popup-close" onclick="closePopup()">✕</button>
      <div id="popup-body">
        <h2 id="modal-title" class="popup-title">Проект</h2>
        <p id="modal-desc" class="popup-desc">Описание...</p>
      </div>
    </div>
  </div>

  <script>
    const DATA = {
      smart: { title: "Smart Project", text: "Описание креативного кейса Smart. Разработка фирменного стиля и мерча." },
      memoria: { title: "Memoria", text: "Арт-бук и концепт-дизайн визуального стиля." },
      lidia: { title: "Lidia & Poggio", text: "Оформление премиальной линейки упаковки." },
      agly: { title: "Agly Girl", text: "Разработка графических материалов для бренда." },
      slet: { title: "Слёт", text: "Айдентика фестиваля и дизайн мерча." },
      platform: { title: "Платформа", text: "Интерфейсы и брендинг диджитал-продукта." },
      smarty: { title: "Smarty App", text: "Интерфейс мобильного приложения." },
      landing: { title: "Landing Page", text: "Проектирование и верстка промо-страницы." },
      sprite: { title: "Sprite Rigging", text: "Настройка графики и анимации персонажа." },
      cv: { title: "О себе", text: "Наташа — графический и бренд-дизайнер. 5 лет опыта разработки ярких визуальных концепций." }
    };

    // Интерактивное движение глаз внутри сокетов
    const eyeL = document.getElementById('eye-l');
    const eyeR = document.getElementById('eye-r');
    
    // Амплитуда движения глазного яблока (в пикселях)
    const maxOffset = 12; 

    document.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      
      // Вычисляем отклонение курсора от центра экрана (от -0.5 до 0.5)
      const x = (e.clientX / innerWidth) - 0.5;
      const y = (e.clientY / innerHeight) - 0.5;

      // Рассчитываем сдвиг для глазного яблока
      const dx = x * maxOffset * 2.2;
      const dy = y * maxOffset * 1.5;

      if (eyeL && eyeR) {
        eyeL.style.transform = `translate(${dx}px, ${dy}px)`;
        eyeR.style.transform = `translate(${dx}px, ${dy}px)`;
      }
    });

    // Модалки
    function openPopup(key) {
      const project = DATA[key];
      if (!project) return;
      document.getElementById('modal-title').innerText = project.title;
      document.getElementById('modal-desc').innerText = project.text;
      document.getElementById('popup-overlay').classList.add('active');
    }

    function closePopup() {
      document.getElementById('popup-overlay').classList.remove('active');
    }

    function closePopupOnBg(e) {
      if (e.target.id === 'popup-overlay') closePopup();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePopup();
    });
  </script>
</body>
</html>
