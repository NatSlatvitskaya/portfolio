<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natasha — Graphic & Brand Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-bg: #20E298; 
      --folder-color: #121214;
      --text-dark: #121214;
      --font-heading: 'Unbounded', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-projects: 'SF UI Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--green-bg);
      font-family: var(--font-body);
      color: var(--text-dark);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Фоновые радиальные свечения для объема */
    .glow-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 75% 50%, rgba(255, 255, 255, 0.35) 0%, transparent 60%),
                  radial-gradient(circle at 25% 50%, rgba(255, 255, 255, 0.2) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }

    /* Шапка сайта */
    .header-bar {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1300px;
      padding: 0 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
    }

    .nav-link {
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      color: var(--text-dark);
    }

    .bio-center {
      text-align: center;
    }

    .bio-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .bio-subtitle {
      font-size: 0.85rem;
      font-weight: 500;
    }

    .experience-tag {
      font-size: 1.1rem;
      font-weight: 700;
    }

    /* ==========================================================================
       МАСКОТ (3D TILT & PARALLAX)
       ========================================================================== */
    .mascot-container {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 950px;
      aspect-ratio: 2398 / 1308;
      z-index: 2;
      pointer-events: none;
      
      /* Задаем 3D перспективу для сцены */
      perspective: 1500px;
    }

    .mascot-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      
      /* Включаем сохранение 3D слоев */
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
    }

    /* Базовый класс для наложения слоев котика */
    .mascot-layer {
      position: absolute;
      inset: 0;
      background-size: contain;
      background-position: center bottom;
      background-repeat: no-repeat;
    }

    /* Слой 1: Белки глаз (в самом низу) */
    .layer-whites {
      background-image: url('eye_whites.png');
      z-index: 1;
      /* Слегка отодвигаем назад в 3D пространстве */
      transform: translateZ(-20px);
    }

    /* Слой 2: Зрачки кота (динамические) */
    .layer-pupils {
      background-image: url('pupils.png');
      z-index: 2;
      transition: transform 0.08s ease-out;
      /* Находится между белком и телом */
      transform: translateZ(-5px);
    }

    /* Слой 3: Тело кота (маска с дырками, сверху) */
    .layer-body {
      background-image: url('cat_body.png');
      z-index: 3;
      /* Выносим вперед в 3D пространстве */
      transform: translateZ(15px);
    }

    /* ==========================================================================
       КАРТОЧКИ ПРОЕКТОВ (SF UI Display, 14px, medium)
       ========================================================================== */
    .projects-container {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .project-item {
      position: absolute;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .project-item:hover {
      transform: scale(1.1) translateY(-4px);
    }

    .folder-shape {
      width: 110px;
      height: 75px;
      background-color: var(--folder-color);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(18, 18, 20, 0.25);
    }

    .image-shape {
      width: 110px;
      height: 75px;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      box-shadow: 0 10px 25px rgba(18, 18, 20, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .project-label {
      font-family: var(--font-projects);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dark);
      text-align: center;
      letter-spacing: -0.2px;
    }

    /* Координаты 8 проектов */
    .item-1 { top: 15%; left: 14%; }  /* SMART */
    .item-2 { top: 38%; left: 24%; }  /* MEMORIA */
    .item-3 { top: 43%; left: 3%; }   /* LIDIA&POGGIO */
    .item-4 { top: 62%; left: 14%; }  /* AGLY GIRL */
    
    .item-5 { top: 28%; right: 26%; } /* СЛЁТ */
    .item-6 { top: 15%; right: 9%; }  /* ПЛАТФОРМА */
    .item-7 { top: 43%; right: 10%; } /* SMARTY */
    .item-8 { top: 62%; right: 20%; } /* LANDING */

    /* ==========================================================================
       НИЖНИЙ ДОК
       ========================================================================== */
    .dock-wrapper {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .cv-badge {
      background-color: var(--folder-color);
      color: var(--green-bg);
      padding: 6px 22px;
      border-radius: 20px;
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }
    .cv-badge:hover { transform: scale(1.05); }

    .glass-dock {
      background: rgba(18, 18, 20, 0.15);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(18, 18, 20, 0.2);
      border-radius: 40px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    .dock-divider {
      width: 1px;
      height: 28px;
      background-color: rgba(18, 18, 20, 0.2);
    }

    .avatar-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--text-dark);
      overflow: hidden;
      cursor: pointer;
    }

    .avatar-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .icon-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--green-bg);
      text-decoration: none;
      font-size: 1.1rem;
      transition: transform 0.2s, background-color 0.2s;
    }

    .icon-circle:hover {
      transform: scale(1.1);
      background-color: #fff;
      color: var(--text-dark);
    }

    /* ПОПАПЫ */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(15px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .popup-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .popup-content {
      background: #121214;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      width: min(750px, 95vw);
      max-height: 80vh;
      overflow-y: auto;
      padding: 32px;
      position: relative;
    }

    .popup-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }

    .popup-title {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      color: var(--green-bg);
      margin-bottom: 8px;
    }

    .popup-desc {
      color: #D6C2CE;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    @media (max-width: 900px) {
      body { overflow-y: auto; }
      .projects-container {
        position: relative;
        margin-top: 150px;
        margin-bottom: 200px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        padding: 20px;
      }
      .project-item {
        position: relative;
        top: auto !important; left: auto !important; right: auto !important;
        transform: none !important;
      }
      .mascot-container {
        position: fixed;
        bottom: 0;
        opacity: 0.4;
        width: 150%;
        height: 60vh;
      }
    }
  </style>
</head>
