<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natasha — Graphic & Brand Designer</title>
  <!-- Подключаем шрифт (при необходимости замените Inter на ваш шрифт из Figma) -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* ГЛОБАЛЬНЫЙ ФИКС ДЛЯ АДАПТИВНОСТИ И ОДНОЭКРАННИКА */
    html {
      /* Формула динамического rem: на экранах 1920px он равен строго 16px, 
         на меньших экранах всё пропорционально сжимается */
      font-size: calc(100vw / 120);
    }
    @media (min-width: 1920px) {
      html { font-size: 16px; }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #050505;
      color: #fff;
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* Строгий запрет на скролл */
      position: relative;
    }

    /* ФОНОВОЕ ВИДЕО И ЭФФЕКТЫ */
    .bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    /* ИНТЕРАКТИВНОЕ НЕОНОВОЕ СВЕЧЕНИЕ КУРСОРA */
    .cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 55vw;
      height: 55vw;
      transform: translate(-50%, -50%);
      /* Радиальный градиент: мятно-зеленый цвет плавно рассеивается в прозрачный */
      background: radial-gradient(circle, rgba(0, 255, 204, 0.16) 0%, rgba(0, 255, 204, 0.05) 45%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      pointer-events: none; /* Свечение "прозрачно" для кликов */
      z-index: -1; /* Строго над видео, но за персонажем и плашками */
      will-change: transform;
      opacity: 0; /* Изначально скрыто, проявится при движении */
      transition: opacity 0.5s ease;
    }

    /* ШАПКА САЙТА */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 10vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4rem;
      z-index: 10;
    }

    .btn-nav {
      background: none;
      border: 1px solid rgba(0, 255, 204, 0.4);
      color: #00ffcc;
      padding: 0.6rem 1.5rem;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    .btn-nav:hover {
      background: rgba(0, 255, 204, 0.1);
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
    }

    .site-title {
      text-align: center;
    }
    .site-title h1 {
      font-size: 1.4rem;
      font-weight: 500;
    }
    .site-title span {
      color: #00ffcc;
      font-size: 1.1rem;
      display: block;
      margin-top: 0.2rem;
    }

    /* ГЛАВНЫЙ КОНТЕЙНЕР СЕТКИ */
    .main-composition {
      display: grid;
      grid-template-columns: repeat(12, 1fr); /* 12 колонок из Figma */
      grid-template-rows: repeat(6, 1fr);    /* 6 рядов из Figma */
      width: 100vw;
      height: 75vh;
      margin-top: 10vh;
      align-items: center;
      justify-items: center;
      position: relative;
    }

    /* ЦЕНТРАЛЬНЫЙ ПЕРСОНАЖ */
    .character-center {
      grid-column: 6 / 8;
      grid-row: 2 / 6;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }
    .character-center img {
      max-height: 90%;
      object-fit: contain;
    }

    /* СТИЛИЗАЦИЯ И РАЗМЕРЫ ПЛАШЕК ИЗ FIGMA */
    .project-card {
      width: 8.875rem;       /* Строго 142px при 1920px */
      height: 9.625rem;      /* Строго 154px при 1920px */
      border-radius: 0.5rem; /* Строго 8px */
      border: 2px solid #00ffcc;
      background: rgba(5, 5, 5, 0.6);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
      z-index: 3;
      align-self: center;
      justify-self: center;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease, border-color 0.3s ease;
    }

    /* ВНУТРЕННЯЯ ЧЕРНАЯ ОБЛАСТЬ ПЛАШКИ */
    .project-card .preview-box {
      width: 7.875rem;       /* Строго 126px при 1920px */
      height: 6.25rem;       /* Строго 100px при 1920px */
      margin-top: 0.5rem;    /* Строго 8px */
      border-radius: 0.5rem; /* Строго 8px */
      background-color: #0b0b0b;
      overflow: hidden;
    }
    .project-card .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .project-card .card-name {
      font-size: 0.8rem;
      margin-top: auto;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
    }

    /* ХОВЕР ЭФФЕКТ ДЛЯ ПЛАШЕК (Увеличение в 1.5 раза) */
    .project-card:hover {
      transform: scale(1.5);
      z-index: 50; /* Поднимается над сеткой и персонажем */
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
    }

    /* КООРДИНАТЫ ДЛЯ КАЖДОЙ ПЛАШКИ ПО НАПРАВЛЯЮЩИМ */
    #card-1 { grid-column: 1; grid-row: 4; }
    #card-2 { grid-column: 3; grid-row: 2; }
    #card-3 { grid-column: 4; grid-row: 3; }
    #card-4 { grid-column: 3; grid-row: 5; }

    #card-5 { grid-column: 9; grid-row: 2; }
    #card-6 { grid-column: 9; grid-row: 5; }
    #card-7 { grid-column: 10; grid-row: 4; } /* NAME 7 */
    #card-8 { grid-column: 12; grid-row: 2; }

    /* ПОДВАЛ (Панель и Категории) */
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 15vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4rem;
      z-index: 10;
    }

    .footer-tags {
      color: rgba(0, 255, 204, 0.7);
      font-size: 1rem;
      display: flex;
      gap: 2rem;
    }

    /* ЦЕНТРАЛЬНАЯ DOCK-ПАНЕЛЬ */
    .dock-panel {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.6rem 2rem;
      border-radius: 3rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .dock-item {
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .dock-item:hover {
      transform: scale(1.2);
      color: #00ffcc;
    }
  </style>
</head>
<body>

  <!-- Фон-видео -->
  <video class="bg-video" autoplay loop muted playsinline>
    <source src="./video/retro-bg.mp4" type="video/mp4"> <!-- Укажите ваш путь к видео -->
  </video>

  <!-- Интерактивное свечение -->
  <div class="cursor-glow"></div>

  <!-- Шапка -->
  <header>
    <button class="btn-nav">Все проекты</button>
    <div class="site-title">
      <h1>Привет, Я — Наташа</h1>
      <span>{графический и бренд-дизайнер}</span>
    </div>
    <button class="btn-nav">6 лет опыта</button>
  </header>

  <!-- Главная композиция по сетке Grid -->
  <main class="main-composition">
    
    <!-- Левая группа плашек -->
    <div class="project-card" id="card-1">
      <div class="preview-box"></div>
      <div class="card-name">NAME 1</div>
    </div>
    <div class="project-card" id="card-2">
      <div class="preview-box"></div>
      <div class="card-name">NAME 2</div>
    </div>
    <div class="project-card" id="card-3">
      <div class="preview-box"></div>
      <div class="card-name">NAME 3</div>
    </div>
    <div class="project-card" id="card-4">
      <div class="preview-box"></div>
      <div class="card-name">NAME 4</div>
    </div>

    <!-- Центральный персонаж -->
    <div class="character-center">
      <img src="./images/character.png" alt="Персонаж"> <!-- Укажите ваш путь к картинке персонажа -->
    </div>

    <!-- Правая группа плашек -->
    <div class="project-card" id="card-5">
      <div class="preview-box"></div>
      <div class="card-name">NAME 5</div>
    </div>
    <div class="project-card" id="card-6">
      <div class="preview-box"></div>
      <div class="card-name">NAME 6</div>
    </div>
    <div class="project-card" id="card-7">
      <div class="preview-box"></div>
      <div class="card-name">NAME 7</div>
    </div>
    <div class="project-card" id="card-8">
      <div class="preview-box"></div>
      <div class="card-name">NAME 8</div>
    </div>

  </main>

  <!-- Подвал -->
  <footer>
    <div class="footer-tags">
      <span>{брендинг}</span>
      <span>{веб-дизайн}</span>
    </div>

    <!-- Панель с иконками (Dock) -->
    <div class="dock-panel">
      <a class="dock-item">CV</a>
      <a class="dock-item">Dprofile</a>
      <a class="dock-item">Telegram</a>
      <a class="dock-item">Email</a>
    </div>

    <div class="footer-tags">
      <span>{коммуникация}</span>
      <span>{иллюстрация}</span>
    </div>
  </footer>

  <!-- Скрипт для плавного движения неонового свечения -->
  <script>
    const glow = document.querySelector('.cursor-glow');
    
    // Координаты цели (мыши) и текущие координаты свечения
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let glowX = mouseX;
    let glowY = mouseY;

    // Включаем видимость свечения только при движении мыши в окне
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      glow.style.opacity = '1';
    });

    // Плавное затухание, если мышка покинула экран браузера
    document.addEventListener('mouseleave', () => {
      glow.style.opacity = '0';
    });

    function animateGlow() {
      // 0.08 — коэффициент инерции. Чем он меньше, тем плавнее и ленивее "тянется" шлейф
      glowX += (mouseX - glowX) * 0.08;
      glowY += (mouseY - glowY) * 0.08;
