<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nat Slatvickaya — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #20E298;        /* Зеленый цвет по умолчанию */
      --cat-color: #121214;       /* Темный цвет папок и текста */
      --accent-neon: #20E298;
      --card-bg: rgba(18, 18, 20, 0.95);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-light: #F3F4F6;
      --text-muted: #9CA3AF;
      --font-heading: 'Unbounded', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* Загружаем реальный кадр bg.png как фоновое изображение на весь экран */
      background-image: url('bg.png');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      background-color: var(--bg-color);
      font-family: var(--font-body);
      color: var(--cat-color);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      transition: background-image 0.5s ease, background-color 0.5s ease;
    }

    /* ==========================================================================
       FULLSCREEN VIDEO PRELOADER (Интро)
       ========================================================================== */
    #video-intro-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #video-intro-container.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #intro-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .skip-btn {
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      cursor: pointer;
      font-family: var(--font-heading);
      transition: all 0.3s ease;
      z-index: 10000;
    }

    .skip-btn:hover {
      background: var(--bg-color);
      color: #000;
      border-color: var(--bg-color);
    }

    /* ==========================================================================
       ВЕРХНЯЯ ПАНЕЛЬ И НАСТРОЙКИ
       ========================================================================== */
    .top-bar {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1200px;
      padding: 0 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--cat-color);
    }

    /* Выбор цвета фона (позволяет менять картинку на bg_purple.png или bg_grey.png) */
    .theme-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(18, 18, 20, 0.15);
      border: 1px solid rgba(18, 18, 20, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
    }

    .theme-picker span {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--cat-color);
    }

    .color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s;
    }

    .color-dot:hover { transform: scale(1.25); }
    .color-dot.active { border-color: var(--cat-color); }
    
    .dot-green { background: #20E298; }
    .dot-purple { background: #925CFF; }
    .dot-grey { background: #A3A3A3; }

    /* ==========================================================================
       СЛЕЖАЩИЕ ГЛАЗА (Накладываются поверх фоновой картинки bg.png)
       ========================================================================== */
    .eyes-container {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1200px;
      /* Соотношение сторон должно соответствовать оригинальному кадру */
      aspect-ratio: 1200 / 600;
      z-index: 2;
      pointer-events: none;
    }

    .interactive-eyes {
      position: absolute;
      /* Подстраиваем координаты точно под отверстия для глаз на фоновом рисунке */
      bottom: 2%; 
      left: 0;
      width: 100%;
      height: auto;
    }

    /* ==========================================================================
       ПАПКИ КЕЙСОВ
       ========================================================================== */
    .folders-container {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .folder-card {
      position: absolute;
      pointer-events: auto;
      width: 120px;
      height: 100px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .folder-card:hover {
      transform: scale(1.15) translateY(-5px);
    }

    .folder-icon {
      position: relative;
      width: 70px;
      height: 50px;
      background-color: var(--cat-color);
      border-radius: 0px 8px 8px 8px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.15);
      transition: background-color 0.3s;
    }

    .folder-icon::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 0;
      width: 30px;
      height: 10px;
      background-color: var(--cat-color);
      border-radius: 5px 5px 0 0;
      transition: background-color 0.3s;
    }

    .folder-icon::after {
      content: '';
      position: absolute;
      top: 5px;
      left: 5px;
      width: 60px;
      height: 40px;
      background-color: #fff;
      border-radius: 4px;
      transform: translateY(0px);
      transition: transform 0.3s ease;
      z-index: -1;
    }

    .folder-card:hover .folder-icon::after {
      transform: translateY(-8px);
    }

    .folder-title {
      margin-top: 10px;
      font-family: var(--font-heading);
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--cat-color);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      max-width: 100px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Расположение папок в свободных зонах над котом */
    .folder-1 { top: 22%; left: 15%; }
    .folder-2 { top: 28%; left: 32%; }
    .folder-3 { top: 20%; left: 50%; transform: translateX(-50%); }
    .folder-4 { top: 20%; right: 15%; }
    .folder-5 { top: 38%; left: 10%; }
    .folder-6 { top: 40%; right: 10%; }
    .folder-7 { top: 30%; right: 30%; }

    /* ==========================================================================
       НИЖНИЙ ДОК (Социальные сети и CV)
       ========================================================================== */
    .bottom-dock {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--cat-color);
      padding: 10px 24px;
      border-radius: 30px;
      display: flex;
      gap: 16px;
      align-items: center;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .dock-btn {
      color: var(--bg-color);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: var(--font-heading);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      transition: background 0.2s, color 0.2s;
    }

    .dock-btn:hover {
      background: #fff;
      color: var(--cat-color);
    }

    /* ==========================================================================
       ВСПЛЫВАЮЩИЕ ОКНА (Попап)
       ========================================================================== */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      padding: 20px;
    }

    .popup-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .popup-content {
      background: #15171C;
      border: 1px solid var(--card-border);
      border-radius: 28px;
      width: min(800px, 95vw);
      max-height: 85vh;
      overflow-y: auto;
      padding: 36px;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .popup-overlay.active .popup-content {
      transform: scale(1);
    }

    .popup-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .popup-close:hover { background: var(--bg-color); color: #000; }

    .popup-title {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      color: var(--bg-color);
      margin-bottom: 6px;
    }

    .popup-media {
      width: 100%;
      border-radius: 16px;
      margin: 20px 0;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }

    .popup-media img, .popup-media video {
      width: 100%;
      height: auto;
      display: block;
    }

    .popup-text { color: var(--text-muted); line-height: 1.6; font-size: 0.95rem; }

    /* Мобильная адаптивность */
    @media (max-width: 768px) {
      body {
        overflow-y: auto;
        background-attachment: scroll;
      }
      .folders-container {
        position: relative;
        margin-top: 180px;
        margin-bottom: 120px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        padding: 0 20px;
        pointer-events: auto;
      }
      .folder-card {
        position: relative;
        top: auto !important;
        left: auto !important;
        right: auto !important;
        bottom: auto !important;
        transform: none !important;
        width: 100%;
        height: auto;
      }
      .eyes-container {
        position: fixed;
        bottom: -50px;
        width: 140%;
        opacity: 0.8;
      }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Video Preloader -->
  <div id="video-intro-container">
    <video id="intro-video" autoplay muted playsinline>
      <source src="intro.mp4" type="video/mp4">
    </video>
    <button class="skip-btn" onclick="closeIntro()">Пропустить интро ➔</button>
  </div>

  <!-- Верхняя панель управления -->
  <div class="top-bar">
    <div class="brand">NAT SLATVICKAYA <span>/ 2D</span></div>
    
    <!-- Переключатель фона (Загружает bg_purple.png или bg_grey.png) -->
    <div class="theme-picker">
      <span>Фон:</span>
      <div class="color-dot dot-green active" onclick="changeBg('bg.png', '#20E298', this)"></div>
      <div class="color-dot dot-purple" onclick="changeBg('bg_purple.png', '#925CFF', this)"></div>
      <div class="color-dot dot-grey" onclick="changeBg('bg_grey.png', '#A3A3A3', this)"></div>
    </div>
  </div>

  <!-- 7 папок кейсов -->
  <div class="folders-container">
    <div class="folder-card folder-1" onclick="openPopup('case1')">
      <div class="folder-icon"></div>
      <div class="folder-title">Cyber Scratch</div>
    </div>
    <div class="folder-card folder-2" onclick="openPopup('case2')">
      <div class="folder-icon"></div>
      <div class="folder-title">Cat Rampage</div>
    </div>
    <div class="folder-card folder-3" onclick="openPopup('case3')">
      <div class="folder-icon"></div>
      <div class="folder-title">Green Burst</div>
    </div>
    <div class="folder-card folder-4" onclick="openPopup('case4')">
      <div class="folder-icon"></div>
      <div class="folder-title">Game FX</div>
    </div>
    <div class="folder-card folder-5" onclick="openPopup('case5')">
      <div class="folder-icon"></div>
      <div class="folder-title">Neon Pulse</div>
    </div>
    <div class="folder-card folder-6" onclick="openPopup('case6')">
      <div class="folder-icon"></div>
      <div class="folder-title">Sprite Rig</div>
    </div>
    <div class="folder-card folder-7" onclick="openPopup('case7')">
      <div class="folder-icon"></div>
      <div class="folder-title">Showreel 26</div>
    </div>
  </div>

  <!-- Глаза накладываются поверх фонового рисунка -->
  <div class="eyes-container">
    <svg class="interactive-eyes" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Зрачки кота, движущиеся за мышью (настроены точно под отверстия глаз на bg.png) -->
      <ellipse id="pupil-left" cx="365" cy="480" rx="14" ry="48" fill="#20E298"/>
      <ellipse id="pupil-right" cx="835" cy="480" rx="14" ry="48" fill="#20E298"/>
    </svg>
  </div>

  <!-- Нижний плавающий док -->
  <div class="bottom-dock">
    <a href="https://t.me/your_telegram" target="_blank" class="dock-btn">✈️ Telegram</a>
    <a href="https://behance.net" target="_blank" class="dock-btn">🎨 Behance</a>
    <a href="https://instagram.com" target="_blank" class="dock-btn">📸 Instagram</a>
    <a href="javascript:void(0)" onclick="openPopup('cv')" class="dock-btn">📄 CV / About</a>
  </div>

  <!-- Окно просмотра проектов (Попап) -->
  <div class="popup-overlay" id="popup-overlay" onclick="closePopupOnBg(event)">
    <div class="popup-content">
      <button class="popup-close" onclick="closePopup()">✕</button>
      <div id="popup-body"></div>
    </div>
  </div>

  <script>
    // База данных кейсов
    const PROJECTS_DATABASE = {
      case1: { title: "Cyber Scratch", subtitle: "Frame-by-Frame 2D", mediaSrc: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&q=80", description: "Кадровая классическая 2D-анимация с динамическим таймингом." },
      case2: { title: "Cat Rampage", subtitle: "Spine 2D Rigging", mediaSrc: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=1200&q=80", description: "Игровой маскот с настроенной костной структурой." },
      case3: { title: "Green Burst", subtitle: "Commercial Motion", mediaSrc: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=1200&q=80", description: "Рекламный анимационный ролик." },
      case4: { title: "Game FX", subtitle: "2D VFX", mediaSrc: "https://images.unsplash.com/photo-1563089145-599997674d42?w=1200&q=80", description: "Набор покадровых спецэффектов." },
      case5: { title: "Neon Pulse", subtitle: "Music Video", mediaSrc: "https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=1200&q=80", description: "Анимационные перебивки для музыкального клипа." },
      case6: { title: "Sprite Rig", subtitle: "Character Animation", mediaSrc: "https://images.unsplash.com/photo-1558470598-a5dda9640f68?w=1200&q=80", description: "Проработка физики и мимики." },
      case7: { title: "Showreel 2026", subtitle: "Main Showreel", mediaSrc: "https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=1200&q=80", description: "Сборка лучших проектов за год." },
      cv: { title: "Nat Slatvickaya — CV / About", subtitle: "2D Animator", mediaSrc: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=1200&q=80", description: "Привет! Я 2D-аниматор.<br><br><b>Email:</b> n.slatvickaya@gmail.com<br><b>Telegram:</b> @nataly_anim" }
    };

    // Смена фона (изменяет фоновую картинку и цвет элементов)
    function changeBg(bgImage, themeColor, element) {
      document.body.style.backgroundImage = `url('${bgImage}')`;
      document.body.style.backgroundColor = themeColor;
      
      // Обновляем цвета элементов дока
      document.querySelectorAll('.dock-btn').forEach(btn => {
        btn.style.color = themeColor;
      });
      
      // Обновляем цвет зрачков под цвет фона
      const pupils = [document.getElementById('pupil-left'), document.getElementById('pupil-right')];
      pupils.forEach(pupil => {
        if (pupil) pupil.setAttribute('fill', themeColor);
      });

      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      element.classList.add('active');
    }

    // Обработка скрытия интро-видео
    const videoContainer = document.getElementById('video-intro-container');
    const introVideo = document.getElementById('intro-video');

    function closeIntro() {
      if (videoContainer) {
        videoContainer.classList.add('hidden');
        if (introVideo) introVideo.pause();
      }
    }

    if (introVideo) {
      introVideo.addEventListener('ended', closeIntro);
      introVideo.addEventListener('error', closeIntro);
    }

    // Логика слежения глаз кота
    const pupilLeft = document.getElementById('pupil-left');
    const pupilRight = document.getElementById('pupil-right');
    const baseLeftX = 365, baseLeftY = 480;
    const baseRightX = 835, baseRightY = 480;
    const maxOffset = 25;

    document.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      const mouseX = (e.clientX / innerWidth) - 0.5;
      const mouseY = (e.clientY / innerHeight) - 0.5;

      if (pupilLeft && pupilRight) {
        pupilLeft.setAttribute('cx', baseLeftX + mouseX * maxOffset * 2.5);
        pupilLeft.setAttribute('cy', baseLeftY + mouseY * maxOffset * 1.5);
        pupilRight.setAttribute('cx', baseRightX + mouseX * maxOffset * 2.5);
        pupilRight.setAttribute('cy', baseRightY + mouseY * mouseX * maxOffset * 1.5);
      }
    });

    // Открытие попапов
    function openPopup(key) {
      const data = PROJECTS_DATABASE[key];
      if (!data) return;
      document.getElementById('popup-body').innerHTML = `
        <h2 class="popup-title">${data.title}</h2>
        <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:15px;">${data.subtitle}</div>
        <div class="popup-media"><img src="${data.mediaSrc}" alt="${data.title}"></div>
        <div class="popup-text">${data.description}</div>
      `;
      document.getElementById('popup-overlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('popup-overlay').classList.remove('active');
    }

    function closePopup() {
      document.getElementById('popup-overlay').classList.remove('active');
    }

    function closePopupOnBg(e) {
      if (e.target.id === 'popup-overlay') closePopup();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePopup();
    });
  </script>
</body>
</html>
